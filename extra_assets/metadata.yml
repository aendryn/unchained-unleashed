# Unchained Unleashed is a fork of Unchained for Android by LivingWithHippos
# (https://github.com/LivingWithHippos/unchained-android) that adds TorBox support
# alongside Real-Debrid. All credit for the original app goes to the upstream project.

AutoName: Unchained Unleashed

RepoType: git
Repo: https://github.com/aendryn/unchained-unleashed

Builds:
  - versionName: 1.0.0
    versionCode: 1
    commit: main
    subdir: app/app
    sudo:
      - apt-get update || apt-get update
      - apt-get install -y openjdk-17-jdk-headless
      - update-alternatives --auto java
    gradle:
      - yes

